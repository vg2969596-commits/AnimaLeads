<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel de Leads - Animasom</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
      }
      .top-bar {
        width: 100%;
        max-width: 420px;
        display: flex;
        justify-content: flex-end;
        margin-bottom: 10px;
      }
      .btn-vendedor {
        background-color: #6c757d;
        color: white;
        border: none;
        padding: 8px 12px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.85rem;
        font-weight: bold;
      }
      .btn-vendedor:hover {
        background-color: #5a6268;
      }
      .container {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }
      .logo-container {
        text-align: center;
        margin-bottom: 20px;
      }
      .logo-container img {
        max-width: 200px;
        width: 100%;
        height: auto;
        display: block;
        margin: 0 auto;
      }
      h2 {
        text-align: center;
        color: #333;
        font-size: 1.2rem;
        margin-bottom: 20px;
      }
      label {
        font-size: 0.85rem;
        color: #666;
        font-weight: bold;
      }
      input,
      select {
        width: 100%;
        padding: 10px;
        margin: 6px 0 15px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 0.95rem;
      }
      button[type="submit"] {
        width: 100%;
        padding: 12px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }
      button[type="submit"]:hover {
        background-color: #218838;
      }
      footer {
        text-align: center;
        margin-top: 20px;
        font-size: 0.8rem;
        color: #777;
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <button
        class="btn-vendedor"
        onclick="window.location.href = 'vendedores.html'"
      >
        Gerenciar Vendedores
      </button>
    </div>

    <div class="container">
      <div class="logo-container">
        <img src="assets/ANIMASOM.png.png" alt="Logo Animasom" />
      </div>

      <h2>Cadastro de Leads</h2>

      <form id="leadForm">
        <label for="nome">Nome do Cliente</label>
        <input type="text" id="nome" placeholder="Primeiro Nome" required />

        <label for="telefone">Celular (WhatsApp)</label>
        <input type="text" id="telefone" placeholder="21999999999" required />

        <label for="dataFesta">Data do Evento</label>
        <input type="date" id="dataFesta" required />

        <label for="codVendedor">Código do Vendedor</label>
        <select id="codVendedor" required>
          <option value="">Carregando vendedores...</option>
        </select>

        <button type="submit">Cadastrar Lead</button>
      </form>
    </div>

    <footer>Desenvolvido por Victor</footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const SUPABASE_URL = "https://ooyhmagecqwwkbclridx.supabase.co";
      const SUPABASE_ANON_KEY =
        "sb_publishable_jkvlLwoABdwIHdCwSi6YDw_96loVt8y";

      const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
      );

      // Carregar vendedores do banco para o campo <select>
      async function carregarVendedoresSelect() {
        const select = document.getElementById("codVendedor");

        const { data, error } = await supabaseClient
          .from("vendedores")
          .select("*")
          .order("nome", { ascending: true });

        if (error) {
          console.error("Erro ao carregar vendedores:", error);
          select.innerHTML =
            '<option value="">Erro ao carregar vendedores</option>';
          return;
        }

        let html = '<option value="">Selecione o Vendedor</option>';
        data.forEach((v) => {
          html += `<option value="${v.codigo}">${v.nome} (${v.codigo})</option>`;
        });
        select.innerHTML = html;
      }

      // Executa ao carregar a página
      carregarVendedoresSelect();

      // Enviar formulário de lead
      document
        .getElementById("leadForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const nome = document.getElementById("nome").value;
          const telefone = document.getElementById("telefone").value;
          const dataFesta = document.getElementById("dataFesta").value;
          const codVendedor = document.getElementById("codVendedor").value;

          const { error } = await supabaseClient.from("leads").insert([
            {
              nome_cliente: nome,
              telefone: telefone,
              data_festa: dataFesta,
              cod_vendedor: codVendedor,
              status_zap: "Pendente",
            },
          ]);

          if (error) {
            console.error("Erro ao cadastrar:", error);
            alert("Erro ao salvar o lead. Verifique os dados.");
          } else {
            alert("Lead cadastrado com sucesso no banco de dados!");
            document.getElementById("leadForm").reset();
          }
        });
    </script>
  </body>
</html>
